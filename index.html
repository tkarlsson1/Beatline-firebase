<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Årsquiz om låtar – spela, gissa och redigera årtal.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- The name under the icon when the page is added to the home screen on iOS -->
  <meta name="apple-mobile-web-app-title" content="Notestream">
  <meta name="theme-color" content="#032934">
  <meta name="color-scheme" content="dark">
  <meta property="og:title" content="Låtårsquiz">
  <meta property="og:description" content="Gissa vilket år låten släpptes.">
  <meta name="twitter:card" content="summary_large_image">

  <title>Notestream 0.875</title>

  <!-- Favicon and manifest -->
  <link rel="icon" type="image/png" href="favicon-graffiti.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-graffiti.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Narrow:wght@500;700&family=Manrope:wght@400;700&display=swap" rel="stylesheet">

  <!-- Styles. The start page shares its look with the lobby and the join page -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="ny/ny.css?v=0.874">
  <link rel="stylesheet" href="ny/dialog.css?v=0.867">
</head>

<body>
  <!-- ============ Log in ============ -->
  <div id="loginModal" style="display: none;" class="modal" role="dialog" aria-modal="true">
    <div class="dialog field">
      <h2>Logga in</h2>
      <input type="email" id="emailInput" placeholder="Ange e-post" autocomplete="username" />
      <input type="password" id="passwordInput" placeholder="Ange lösenord" autocomplete="current-password" />
      <a href="#" id="forgotPasswordLink" class="text-link">Glömt lösenord?</a>
      <p id="loginError" class="error">Fel e-post eller lösenord!</p>
      <button class="big-btn" id="loginButton">Logga in</button>
    </div>
  </div>

  <!-- ============ Start ============ -->
  <div class="page" id="mainContent" style="display: none;">
    <img src="logga-graffiti.png" alt="Notestream" class="logo" />

    <button class="big-btn" id="newGameBtn">NYTT SPEL</button>
    <button class="big-btn secondary" id="myPlaylistsBtn">MINA SPELLISTOR</button>

    <p class="status-line" id="spotifyStatus"></p>
    <div id="spotifyConnect" style="display: none;">
      <button class="big-btn secondary" id="connectSpotifyBtn">KOPPLA SPOTIFY</button>
    </div>

    <!-- ============ My playlists ============ -->
    <div class="section" id="playlistsPanel" style="display: none;">
      <hr class="section-divider">
      <h2>Mina spellistor</h2>
      <div class="panel">
        <div id="myPlaylistsList"><p class="hint">Hämtar dina spellistor...</p></div>
      </div>

      <h2 class="section-next">Lägg till en Spotify-spellista</h2>
      <div class="panel field">
        <label for="playlistLinkInput">Länk till spellistan</label>
        <input type="text" id="playlistLinkInput" placeholder="Klistra in Spotify-länken" autocomplete="off">
        <label for="playlistNameInput">Namn i Notestream</label>
        <input type="text" id="playlistNameInput" placeholder="Spellistans namn" autocomplete="off">
        <button class="big-btn secondary" id="addPlaylistButton">Lägg till</button>

        <div id="importProgressContainer" class="import-progress" style="display: none;">
          <div id="importProgressInfo" class="import-progress-info"></div>
          <div class="import-progress-line">
            <div id="importSpinner" class="import-spinner" style="display: none;"></div>
            <span id="importProgressText">Förbereder...</span>
          </div>
        </div>
        <p class="hint">I Spotify: öppna spellistan, välj Dela och Kopiera länk till spellista. Listan måste vara offentlig.</p>
      </div>
    </div>

    <div class="footer-links">
      <a href="#" id="logoutLink">Logga ut</a>
    </div>
  </div>

  <!-- ============ Team name for a new game ============ -->
  <div id="newGameModal" class="modal" style="display: none;" role="dialog" aria-modal="true">
    <div class="dialog field">
      <h2>Nytt spel</h2>
      <label for="hostTeamNameInput">Ditt lagnamn</label>
      <input type="text" id="hostTeamNameInput" maxlength="20" placeholder="Lagets namn" autocomplete="off">
      <div class="field-error" id="hostTeamNameError"></div>
      <button class="big-btn" id="confirmNewGameBtn">ÖPPNA LOBBYN</button>
      <button class="big-btn secondary" id="cancelNewGameBtn">Avbryt</button>
    </div>
  </div>

  <!-- The Spotify connection, shared with the game -->
  <script src="spotify-auth.js?v=0.799"></script>
  <!-- Helpers shared with the lobby and the game: game ids, team colours, name rules -->
  <script src="lobby.js?v=0.799"></script>
  <!-- The playlist import -->
  <script src="spotify.js?v=0.854"></script>
  <!-- Questions and messages in the page's own box -->
  <script src="ny/dialog.js?v=0.858"></script>
  <script type="module" src="ny/start.js?v=0.875"></script>

  <!-- Service worker: offline page and cache, as the old start page registers it -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/service-worker.js")
        .catch(error => console.error("Service worker registration failed:", error));
    }
  </script>
</body>
</html>
